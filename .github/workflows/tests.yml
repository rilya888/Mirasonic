name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pytest-asyncio, not just pytest: the agent's ListenBrainz and weekly-run
      # tests are async, and without it they are skipped as errors, not run.
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # Live tests are deselected by pytest.ini; nothing here touches YouTube.
      - run: python -m pytest -q
